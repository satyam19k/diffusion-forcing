# DFoT with JEPA-style VAE training
# This config extends dfot_video.yaml with JEPA-specific settings

defaults:
  - dfot_video

# Disable torch.compile for JEPA (not verified for this model type)
compile: false

# JEPA-specific configuration
jepa:
  # Loss weight for JEPA prediction loss (combined with DFoT loss)
  loss_weight: 1.0
  
  # Reconstruction loss weight (ensures VAE still produces decodable representations)
  # Set to 0 to disable, recommended: 0.1-1.0
  recon_loss_weight: 0.5

  # Learning rates
  lr: 1e-4  # for action encoder and ViT predictor
  vae_lr: 1e-5  # for VAE (if trainable)

  # Whether to train VAE encoder/decoder
  # train_vae_encoder: true  # Train encoder to learn predictable representations
  # train_vae_decoder: false  # Keep decoder frozen to preserve reconstruction

  # # Use mode() instead of sample() for JEPA targets (deterministic, stable)
  # use_mode_for_targets: true
  
  # SigREG — anti-collapse regularization on online encoder embeddings
  # Pushes latent distribution toward isotropic Gaussian via sliced EP test
  sigreg_loss_weight: 1.0   # weight relative to JEPA pred loss; 0 to disable
  sigreg_num_slices: 1024   # random projection directions (512-2048 typical)

  # Training mode: "teacher_forcing" or "autoregressive"
  # - teacher_forcing: use ground truth states as input (faster, more stable)
  # - autoregressive: use predicted states as input (harder, more realistic)
  training_mode: teacher_forcing

  # Number of fixed probe videos to encode and log at every validation step
  num_vis_videos: 3

  # EMA update schedule
  ema_decay: 0.99
  ema_update_every: 100  # steps

  # Action encoder config
  action_embed_dim: 256
  action_hidden_dim: 256

  # ViT Predictor config
  predictor_hidden_dim: 512
  predictor_depth: 4
  predictor_heads: 8
  predictor_dim_head: 64
  predictor_mlp_ratio: 4.0
  predictor_dropout: 0.1