defaults:
 - base_pytorch_algo

# warmup_steps and disc_start will be halved due to GAN training
# Since we load pretrained weights (including discriminator), disc_start can be low

warmup_steps: 1000
gradient_clip_val: 1.0
embed_dim: 4

lossconfig:
  disc_start: 1001  # Start discriminator early since it's pretrained
  kl_weight: 0.000001
  disc_weight: 0.5

ddconfig:
  double_z: true
  z_channels: 4
  resolution: ${dataset.resolution}
  in_channels: 3
  out_ch: 3
  ch: 128
  ch_mult: [1, 2, 4, 4]
  num_res_blocks: 2
  attn_resolutions: []
  dropout: 0.0

ckpt_path: null

# Predictive VAE specific settings
action_dim: ${dataset.external_cond_dim}
frame_skip: ${dataset.frame_skip}
external_cond_stack: ${dataset.external_cond_stack}

# Predictor configuration for rolling prediction
# This uses predicted latents from previous steps instead of ground truth,
# allowing errors to accumulate and encouraging stable latents over long horizons
predictor:
  enabled: true
  hidden_dim: 64
  lambda_pred: 1.0  # weight for rolling predictive loss

# Pretrained VAE path (for loading encoder/decoder weights)
pretrained_vae_path: "pretrained:ImageVAE_MCRAFT.ckpt"


