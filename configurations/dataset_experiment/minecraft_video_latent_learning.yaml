# @package _global_

# When the (dataset, experiment) pair aligns with the file name of this yaml, 
# the values here will override individual yamls files for dataset, algorithm and experiment.
# useful for dataset-specific overrides

# NOTE: For predictive VAE training, override these settings on command line:
#   dataset.max_frames=8 dataset.frame_skip=2 dataset.external_cond_dim=4

dataset:
  latent:
    enable: False
  max_frames: 2  # Override to 8 for predictive training
  frame_skip: 150  # Override to 2 for predictive training
  context_length: 0
  external_cond_dim: 0  # Override to 4 for predictive training (enables actions)
  
experiment:
  training:
    batch_size: 2
    data:
      num_workers: 8
  validation:
    batch_size: 2
    data:
      num_workers: 8
